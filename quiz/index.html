    shown = MAXC; render(); renderSel();       // 答对后把 5 条线索全部翻开（Futbol11 的做法）
    el('msg').className = 'msg ok';
    el('msg').textContent = '🎉 猜中了！' + name + ' 和这 5 匹都同场过（第 ' + at + ' 条线索时猜中）';
  } else {
    guesses.push(name);
    el('hist').innerHTML = guesses.map(n => '<s>' + n + '</s>').join('');
    used++;                                    // 猜错消耗 1 次机会
    if (used >= MAXG) return lose('机会用完');
    if (shown < MAXC) shown++;
    render(); renderSel();                     // 揭晓下一条后，候选同步剔除（已猜错的置灰）
    el('msg').className = 'msg no';
    el('msg').textContent = '不是 ' + name + '（还剩 ' + (MAXG - used) + ' 次）';
  }
};
el('bSkip').onclick = () => {
  if (done || !T) return;
  if (shown >= MAXC) return;                   // 5 条线索已全给，无得再跳
  used++;                                      // 跳过同样消耗 1 次机会
  if (used >= MAXG) return lose('机会用完');
  shown++; render(); renderSel();
  el('msg').className = 'msg';
  el('msg').textContent = '跳过一条线索（消耗 1 次机会），还剩 ' + (MAXG - used) + ' 次';
};
el('bGive').onclick = () => { if (T && !done) lose('认输'); };
el('bNext').onclick = nextQ;
renderSel(); nextQ();
</script>
</body>
</html>
