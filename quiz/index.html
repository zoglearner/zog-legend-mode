const MAXC = 5, MAXG = 5;
let T = null, clues = [], shown = 0, guesses = [], done = false, used = 0;
const el = id => document.getElementById(id);
const dec = b => b - b % 10;

/* 候选范围：只给「答案生年 ±2 年」里的 G1 马，不显示年份 */
const WIN = 2;
const inWin = h => T && Math.abs(h.b - T.b) <= WIN;
/* 下拉里按马名首字的五十音行分组（与年份无关，不泄露目标年） */
const ROWS = [[0x30A1, 0x30AA, 'あ行'], [0x30AB, 0x30B4, 'か行'], [0x30B5, 0x30BE, 'さ行'],
              [0x30BF, 0x30C9, 'た行'], [0x30CA, 0x30CE, 'な行'], [0x30CF, 0x30DD, 'は行'],
              [0x30DE, 0x30E2, 'ま行'], [0x30E3, 0x30E8, 'や行'], [0x30E9, 0x30ED, 'ら行'],
              [0x30EE, 0x30FA, 'わ行']];
const ROW_ORDER = ROWS.map(r => r[2]).concat('A-Z / 他');
function rowOf(name){
  let c = name.charCodeAt(0);
  if (c >= 0x3041 && c <= 0x3096) c += 0x60;           // 平假名 → 片假名
  for (const r of ROWS) if (c >= r[0] && c <= r[1]) return r[2];
  return 'A-Z / 他';
}
function renderSel(){
  const list = DATA.t.filter(inWin)
    .filter(h => clues.slice(0, shown).indexOf(h.n) < 0)   // 只排除「已揭晓」的线索马
    .sort((a, b) => a.n.localeCompare(b.n, 'ja'));
  el('sel').innerHTML = ROW_ORDER.map(r => {
    const items = list.filter(h => rowOf(h.n) === r);
    if (!items.length) return '';
    return '<optgroup label="' + r + '">' + items.map(h => {
      const bad = guesses.indexOf(h.n) >= 0;             // 猜错的置灰（不再可选）
      return '<option value="' + h.k + '"' + (bad ? ' disabled' : '') + '>' +
             (bad ? '✕ ' : '') + h.n + '</option>';
    }).join('') + '</optgroup>';
  }).join('');
  const s = el('sel');
  if (s.selectedOptions[0] && s.selectedOptions[0].disabled){
    for (const o of s.options) if (!o.disabled){ s.value = o.value; break; }
  }
}
function nextQ(){
  T = DATA.t[Math.random() * DATA.t.length | 0];
  clues = T.c.slice(); for (let i = clues.length - 1; i > 0; i--){ const j = Math.random() * (i + 1) | 0; [clues[i], clues[j]] = [clues[j], clues[i]]; }
  shown = 1; guesses = []; done = false; used = 0;
  el('msg').textContent = ''; el('msg').className = 'msg';
  el('shown').textContent = shown;
  el('hist').innerHTML = '';
  render(); renderSel();
}
function render(){
  el('slots').innerHTML = clues.map((n, i) =>
    '<div class="slot' + (i < shown ? '' : ' hid') + (i === shown - 1 ? ' new' : '') + '">' +
    '<span class="n">' + (i < shown ? n : '?') + '</span></div>').join('');
  el('shown').textContent = shown;
  el('left').textContent = MAXG - used;
}
function lose(msg){
  done = true;
  shown = MAXC; render(); renderSel();        // 收摊：把 5 条线索全部翻开，并同步候选
  el('msg').className = 'msg no';
  el('msg').textContent = msg + ' —— 答案：' + T.an.join(' / ');
}
el('bGo').onclick = () => {
  if (done || !T) return;
  const k = el('sel').value; if (!k) return;
  const name = DATA.t.find(h => h.k === k).n;
  if (T.a.indexOf(k) >= 0){                    // 只要和这 5 匹都同场过就算对（答案可能不止一个）
    done = true;
    const at = shown;
    shown = MAXC; render(); renderSel();       // 答对后把 5 条线索全部翻开（Futbol11 的做法）
    el('msg').className = 'msg ok';
    el('msg').textContent = '🎉 猜中了！' + name + ' 和这 5 匹都同场过（第 ' + at + ' 条线索时猜中）';
  } else {
    guesses.push(name);
    el('hist').innerHTML = guesses.map(n => '<s>' + n + '</s>').join('');
    used++;                                    // 猜错消耗 1 次机会
    if (used >= MAXG) return lose('机会用完');
    if (shown < MAXC) shown++;
    render(); renderSel();                     // 揭晓下一条后，候选同步剔除（已猜错的置灰）
    el('msg').className = 'msg no';
    el('msg').textContent = '不是 ' + name + '（还剩 ' + (MAXG - used) + ' 次）';
  }
};
el('bSkip').onclick = () => {
  if (done || !T) return;
  if (shown >= MAXC) return;                   // 5 条线索已全给，无得再跳
  used++;                                      // 跳过同样消耗 1 次机会
  if (used >= MAXG) return lose('机会用完');
  shown++; render(); renderSel();
  el('msg').className = 'msg';
  el('msg').textContent = '跳过一条线索（消耗 1 次机会），还剩 ' + (MAXG - used) + ' 次';
};
el('bGive').onclick = () => { if (T && !done) lose('认输'); };
el('bNext').onclick = nextQ;
renderSel(); nextQ();
</script>
