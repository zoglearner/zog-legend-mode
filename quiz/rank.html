<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>赛马排排坐</title>
<!--
  赛马排排坐（排序游戏）
  ─────────────────────
  一局 = 一个概念（池化随机）⇒ 从池里随机抽 N 个数值互不相同的对象 ⇒ 玩家排出名次。
  ✱ 2026-09-27 用户：**淡化 Top10**，别暗示"这是史上前十" —— 它只是
    「比大小、比多少，按顺序排排坐」，名次 1–N 只表示**这一局里**谁多谁少。

  ✱ 2026-09-27 用户：参考 futbol11 的 **Pyramid + Top10**（已扒其真实 CSS 对齐）：
    · **答案出现方式＝Pyramid**：名字**一个一个出现**，放进选定的位置；
      揭晓时 对＝松石绿 / 错＝玫红，**一整列全对时该列加高亮描边**（Pyramid .correctRow 的做法）。
    · **排列模板＝Top10**：每个位置是**横向长条** `[序号 12%] │ [名字 88%]`（中间一条竖分隔线），
      数值右对齐；容器居中收窄；**2 列 × 5 行**（Top10 手机版就是 2 列）。
   ✱ 2026-09-27 用户：**放完别自动揭晓** —— 要留出「随便改位置」的机会：
      放满后进入**互换模式**（点两个位置互换，Pyramid 原文 "click on the two spots
      you want to switch"），满意了再按**提交**，提交才揭晓。

  题面**说「更」不说「最」**（2026-09-25 裁定）：只要求"把这 N 个排序"，不宣称史上前十。
  视觉（2026-09-26 定）：**青绿松石 × 珊瑚**（亮 · 冷暖对撞）；
    一种颜色只准一种含义：珊瑚＝强调，松石＝正确，玫红＝错误。
-->
<style>
  :root{
    --bg:#eaf7f5;                                  /* 亮 · 松石底 */
    --surface:rgba(255,255,255,.80); --surface2:rgba(255,255,255,.66);
    --chip:#ffffff;
    --slot-bg:rgba(15,139,141,.035);
    --ink:#10262a; --sub:#5d7d80; --ph:#93adb0;
    --line:rgba(16,38,42,.14); --line2:rgba(16,38,42,.08);
    --accent:#f2643c;                              /* 珊瑚：强调 / 选中 / 结果 */
    --accent-line:rgba(242,100,60,.45); --accent-dim:rgba(242,100,60,.12);
    --ok:#0f8b8d; --ok-line:rgba(15,139,141,.5);  --ok-bg:rgba(15,139,141,.13);
    --bad:#e2564c; --bad-line:rgba(226,86,76,.5); --bad-bg:rgba(226,86,76,.11);
    --btnfill:#0f8b8d; --onbtn:#fff;               /* 主按钮＝松石填充反白 */
    --rk:linear-gradient(160deg,#12a3a5,#0b6f71);  /* 序号圆标（当前待放）*/
    --sh1:0 1px 2px rgba(16,38,42,.07);
    --sh2:0 20px 44px -24px rgba(16,38,42,.34);
    --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","PingFang SC",
           "Hiragino Sans GB","Microsoft YaHei",sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;color:var(--ink);min-height:100vh;font-size:15px;line-height:1.6;
       font-family:var(--sans);background:var(--bg);
       background-image:
         radial-gradient(86% 56% at 6% -12%, rgba(15,139,141,.26), transparent 62%),
         radial-gradient(70% 50% at 96% 106%, rgba(242,100,60,.18), transparent 62%);
       background-attachment:fixed}
  .wrap{max-width:680px;margin:0 auto;padding:22px 16px 64px}

  /* ── 页头 ─────────────────────────── */
  .top{display:flex;align-items:flex-end;gap:10px;flex-wrap:wrap;margin-bottom:14px}
  h1{margin:0;font-size:22px;font-weight:650;letter-spacing:.3px}
  h1 em{font-style:normal;color:var(--accent)}
  .sub{color:var(--sub);font-size:12px}
  /* 返回首页：与 bingo / impostor / 连线 同一套写法（.back） */
  .back{display:inline-block;font-size:12.5px;color:var(--sub);text-decoration:none;
        margin-bottom:10px;letter-spacing:.04em}
  .back:hover{color:var(--accent)}
  /* 页脚：数据截止说明 */
  .foot{margin-top:16px;text-align:center;font-size:11.5px;color:var(--sub);line-height:1.8}
  .foot b{color:var(--ink);font-weight:600}
  button{font:inherit;font-size:12.5px;padding:6px 13px;border:1px solid var(--line);
        background:var(--surface2);color:var(--ink);border-radius:9px;cursor:pointer;
        backdrop-filter:blur(8px);transition:.15s}
  button:hover{border-color:var(--accent);color:var(--accent)}
  button.main{background:var(--btnfill);color:var(--onbtn);border-color:transparent;font-weight:600}
  button.main:hover{filter:brightness(1.06);color:var(--onbtn)}
  button[disabled]{opacity:.4;cursor:not-allowed}
  button[disabled]:hover{border-color:var(--line);color:var(--ink);filter:none}

  /* ── 面板 ─────────────────────────── */
  .card{background:var(--surface);border:1px solid var(--line);border-radius:16px;
       padding:16px 16px 18px;backdrop-filter:blur(14px);box-shadow:var(--sh2)}
  .cat{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
  .prompt{font-size:17px;font-weight:600;letter-spacing:.2px}

  /* ── 这一次要放的名字（Pyramid .nextPlayer 的位置）── */
  .now{display:flex;align-items:center;gap:12px;margin-top:14px;padding:13px 16px;
       border-radius:13px;background:var(--chip);border:1px solid var(--accent-line);
       box-shadow:var(--sh1);min-height:60px}
  .now .nm{flex:1;font-size:21px;font-weight:700;letter-spacing:.2px;line-height:1.25;
           word-break:break-word}
  .now .rest{flex:none;color:var(--sub);font-size:12px;font-variant-numeric:tabular-nums}
  .now.done{border-style:dashed;border-color:var(--line);justify-content:center;
            box-shadow:none;background:var(--slot-bg)}
  .now.done .tip{color:var(--sub);font-size:13px}

  /* ── 位置：Top10 长条，2 列 × 5 行 ── */
  .grid{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:repeat(5,auto);
        grid-auto-flow:column;gap:7px 16px;margin-top:14px}
  .slot{display:flex;align-items:stretch;min-height:42px;border-radius:9px;overflow:hidden;
        border:1px solid var(--line);background:var(--chip);cursor:pointer;
        box-shadow:var(--sh1);transition:.13s}
  .slot.empty{border-style:dashed;background:var(--slot-bg);box-shadow:none}
  .slot.empty:hover{border-color:var(--accent);background:var(--accent-dim)}
  .slot.filled:hover{border-color:var(--accent)}
  .slot .rk{flex:none;width:28px;display:grid;place-items:center;font-size:11.5px;
            font-weight:700;color:var(--sub);font-variant-numeric:tabular-nums}
  .slot .bd{flex:none;width:1px;background:var(--line)}   /* Top10 的竖分隔线 */
  .slot .nm{flex:1;display:flex;align-items:center;padding:5px 9px;font-size:12.5px;
            font-weight:600;line-height:1.3;word-break:break-word}
  .slot .ph{flex:1;display:flex;align-items:center;padding:5px 9px;font-size:11.5px;color:var(--ph)}
  .slot .vl{flex:none;display:flex;align-items:center;padding:5px 10px 5px 2px;
            font-size:11.5px;color:var(--sub);font-variant-numeric:tabular-nums}
  .slot.sel{border-color:var(--accent);box-shadow:0 0 0 1.5px var(--accent-line)}
  .slot.sel .rk{color:var(--accent)}
  .slot.ok{background:var(--ok-bg);border-color:var(--ok-line)}
  .slot.ok .rk,.slot.ok .vl{color:var(--ok)}
  .slot.bad{background:var(--bad-bg);border-color:var(--bad-line)}
  .slot.bad .rk,.slot.bad .vl{color:var(--bad)}
  /* 注：Pyramid 的「整层全对高亮」不照搬 —— 它的"层"是语义层（第几层），
     我们的 1–5 / 6–10 只是排版切分，高亮没有意义。 */

  .howto{font-size:11.5px;color:var(--sub);margin-top:12px;line-height:1.7}
  .howto b{color:var(--ink);font-weight:600}
  .bar{display:flex;gap:9px;align-items:center;margin-top:14px;flex-wrap:wrap}

  /* ── 结果 ─────────────────────────── */
  .res{margin-top:14px;font-size:14px;display:flex;align-items:baseline;gap:8px}
  .res b{font-size:26px;font-weight:700;color:var(--accent);letter-spacing:-.5px}
  .ln{height:1px;background:var(--line2);margin:14px 0}
  .ans{font-size:12.5px;line-height:2}
  .ans span{display:inline-block;margin-right:16px}
  .ans i{font-style:normal;color:var(--sub)}
  @media (max-width:560px){
    h1{font-size:19px} .prompt{font-size:15.5px}
    .now .nm{font-size:17px}
    .grid{gap:5px 10px}
    .slot{min-height:38px;border-radius:8px}
    .slot .rk{width:22px;font-size:10.5px}
    .slot .nm{font-size:11px;padding:4px 6px}
    .slot .vl{font-size:10px;padding:4px 7px 4px 0}
  }
</style></head><body>
<div class="wrap">
  <a class="back" href="../">← 返回首页</a>

  <div class="top">
    <div>
      <h1>赛马<em>排排坐</em></h1>
      <div class="sub">比大小 · 比多少，按顺序坐好就行</div>
    </div>
    <span style="flex:1"></span>
    <button class="main" id="next">下一局</button>
  </div>

  <div class="card">
    <div class="cat">
      <span class="prompt" id="prompt"></span>
      <span class="sub" id="dir">多的在前</span>
    </div>

    <!-- 这一次要放的名字 -->
    <div class="now" id="now"></div>

    <!-- 位置：Top10 长条，2 列 × 5 行 -->
    <div class="grid" id="grid"></div>

    <div class="howto">① <b>点位置</b>：把上面那个名字放进你选的位置（点已放好的＝取回）
      ｜ ② <b>随便调</b>：放满后点两个位置就能互换，满意了再按提交</div>

    <div class="bar">
      <button class="main" id="submit" disabled>提交</button>
      <button id="reset">重新洗牌</button>
      <span class="sub" id="msg"></span>
    </div>
    <div class="res" id="res"></div>
    <div class="ln"></div>
    <div class="ans" id="ans"></div>
  </div>

  <div class="foot">
    <b>数据截止 2026 年 9 月</b>　·　全部为日本国内（JRA・地方竞马）真实成绩<br>
    数值为生涯累计，随赛季推进会有变化
  </div>
</div>

<script>
/* 赛马排排坐（排序游戏）—— 口径见 tools/赛马排行/排行玩法设计.md
   · 题目 = 概念（池化随机）：每局从概念池里**随机抽 N 个数值互不相同**的对象
   · 题面**说「更」不说「最」**：只要求"把这 N 个排序"，不宣称史上前十
   · ✱ 2026-09-27：淡化 Top10；交互＝Pyramid（名字逐个出现、点位置放进去）；
     排列＝Top10（长条 `序号│名字　数值`，2 列 × 5） */
let DATA = [], cur = null, placed = [], queue = [], done = false, sel = -1;

fetch('../assets/data/rank/play.json').then(r => r.json()).then(d => {
  DATA = d.concepts;
  newGame();
});

const esc = s => String(s).replace(/[&<>"]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const shuf = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--){ const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };

/* 数值显示：fmt:"ok" ⇒ 億円值渲染成「X億Y万」；其余直接 v+unit */
function fmtVal(v, c){
  if (c.fmt === 'ok'){
    let ok = Math.floor(v), man = Math.round((v - ok) * 10000);
    if (man >= 10000){ ok += 1; man -= 10000; }
    if (ok === 0) return man + '万';
    if (man === 0) return ok + '億';
    return ok + '億' + man + '万';
  }
  return v + (c.unit || '');
}

/* 抽一局：A 型从池里随机抽 N 个不同值；B 型**有 pool 就同款随机抽**（否则回退固定分项） */
function drawItems(c){
  if (c.kind === 'B' && !(c.pool && c.pool.length)){
    const s = c.subs[0];
    return (s ? s.items : []).map(x => ({...x}));
  }
  // 每数值只取 1 个，同值多个里随机选 1 个，保证一局内数值互不相同
  const byv = new Map();
  c.pool.forEach(p => { if (!byv.has(p.v)) byv.set(p.v, []); byv.get(p.v).push(p); });
  return shuf([...byv.keys()]).slice(0, c.n).sort((a, b) => b - a)
    .map(v => ({...byv.get(v)[Math.random() * byv.get(v).length | 0]}));
}

function newGame(){
  const c = DATA[Math.random() * DATA.length | 0];
  const items = drawItems(c).slice(0, c.n);
  cur = {c, items, n: items.length};
  placed = new Array(cur.n).fill(null);
  queue = shuf(items.map((_, i) => i));      // 待放队列；队首＝当前要放的那个
  done = false; sel = -1;
  document.getElementById('res').textContent = '';
  document.getElementById('msg').textContent = '';
  document.getElementById('ans').innerHTML = '';
  render();
}

function render(){
  const {c, items} = cur;
  document.getElementById('prompt').textContent = c.label || c.title;
  document.getElementById('dir').textContent = '多的在前';

  // ① Pyramid 式：一次只出一个名字
  const now = document.getElementById('now');
  if (queue.length){
    now.className = 'now';
    now.innerHTML = `<span class="nm">${esc(items[queue[0]].n)}</span>`
      + `<span class="rest">${cur.n - queue.length + 1} / ${cur.n}</span>`;
  } else if (!done){
    now.className = 'now done';
    now.innerHTML = '<span class="tip">都放好了 — 点两个位置可以互换，满意了就按「提交」</span>';
  } else {
    now.className = 'now done';
    now.innerHTML = '<span class="tip">已提交 — 看看排得对不对</span>';
  }

  // ② Top10 式长条，2 列 × 5（列优先：左列 1–5、右列 6–10）
  let html = '';
  for (let i = 0; i < cur.n; i++){
    const p = placed[i];
    let cls = 'slot ' + (p == null ? 'empty' : 'filled');
    if (sel === i) cls += ' sel';
    if (done && p != null) cls += (p === i ? ' ok' : ' bad');
    html += `<div class="${cls}" data-i="${i}">`
      + `<span class="rk">${i + 1}</span><span class="bd"></span>`
      + (p == null
          ? '<span class="ph">放这里</span>'
          : `<span class="nm">${esc(items[p].n)}</span>`
            + (done ? `<span class="vl">${fmtVal(items[p].v, c)}</span>` : ''))
      + '</div>';
  }
  const grid = document.getElementById('grid');
  grid.innerHTML = html;

  // 提交按钮：**全部放完**才可用；揭晓后禁用
  document.getElementById('submit').disabled = !(cur && !queue.length && !done);
  // ⚠️ 2026-09-27：**提交后禁用「重新洗牌」** —— 否则同一批题＋已知答案
  //    可以反复重排刷「全对」（答案记忆）。要再来一次只能按「下一局」抽新题。
  document.getElementById('reset').disabled = done;

  grid.querySelectorAll('.slot').forEach(el => {
    const i = +el.dataset.i;
    el.onclick = () => {
      if (done) return;
      // ── 阶段 1：还有名字没放 ⇒ 点空位放进去 / 点已放好的＝取回 ──
      if (queue.length){
        if (placed[i] != null){
          queue.unshift(placed[i]); placed[i] = null; sel = -1; render(); return;
        }
        placed[i] = queue.shift();
        sel = -1; render(); return;
      }
      // ── 阶段 2：全部放完、未提交 ⇒ 点两个位置互换（Pyramid 的做法）──
      if (sel === -1){ sel = i; render(); return; }
      if (sel === i){ sel = -1; render(); return; }
      const t = placed[sel]; placed[sel] = placed[i]; placed[i] = t;
      sel = -1; render();
    };
  });
}

function reveal(){
  done = true; sel = -1;
  const right = placed.reduce((a, p, i) => a + (p === i ? 1 : 0), 0);
  document.getElementById('res').innerHTML =
    `<b>${right}</b><span>/ ${cur.n} 排对</span>`
    + `<span class="sub">${right === cur.n ? '全对 🎉' :
        (right >= cur.n - 2 ? '很接近' : '再接再厉')}</span>`;
  document.getElementById('ans').innerHTML = '<b style="color:var(--accent)">正确顺序</b><br>'
    + cur.items.map((x, i) => `<span>${i + 1}. ${esc(x.n)} <i>${fmtVal(x.v, cur.c)}</i></span>`).join('');
  render();
}

document.getElementById('reset').onclick = () => {
  if (!cur || done) return;        // ⚠️ 揭晓后**不许重来**（否则同题＋已知答案＝刷全对）
  placed = new Array(cur.n).fill(null);
  queue = shuf(cur.items.map((_, i) => i));
  done = false; sel = -1;
  document.getElementById('res').textContent = '';
  document.getElementById('msg').textContent = '';
  document.getElementById('ans').innerHTML = '';
  render();
};
document.getElementById('next').onclick = newGame;
document.getElementById('submit').onclick = () => {
  if (!cur || queue.length || done) return;      // 没放完不给交
  reveal();
};
</script></body></html>
