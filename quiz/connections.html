<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>赛马连线</title>
<!--
  赛马连线（Connections 玩法）
  ─────────────────────────
  16 匹马分成 4 组 × 4 匹，每组一个隐藏主题。选 4 匹提交，对了揭示主题并锁定。

  出题的生命线：**每匹马恰好满足 4 个主题中的 1 个** ⇒ 分组唯一，不存在第二种分法。
  做法：每张卡只从「独占成员」里挑 4 匹（满足本卡、且不满足另外 3 张卡）。

  主题可以是**复合条件**：赢过 皐月賞 ＋ 赢过 東京優駿（日本ダービー）⇒ 二冠馬。
  复合是既往小游戏（Bingo / 找内鬼 / 猜猜我是谁）都没有的，本作第一次启用 conds 长度 2。

  数据（纯静态，fetch 即可）
    ../assets/data/connections/cards.json   主题卡（单条件 + 复合 + 称号），h 按名气降序
                                            称号卡带 sub ⇒ 揭示时「称号作主标题、规则文本作副标题」
    ../assets/data/connections/names.json   马 ID → 日文名 / 英文名（`f` 名气字段仍在下发，但**本作不再使用**）

  配色纪律（§0.2）：一种颜色只准一种含义。
    未解开 ⇒ 一律中性（颜色若按组区分就等于把答案画出来了）
    解开后 ⇒ 颜色 = 该组的身份；红色只留给「错了」

  视觉（2026-09-24 第 5 版 · ✅ 已定）：**雾霾青灰 × 蜜橙**
    雾霾青灰底 + 两团雾状光晕（青灰·淡紫）+ 白玻璃面板（backdrop blur）。眉题用蜜橙点缀。
    无衬线（SF / Inter 系）；选中格/主按钮＝墨黑填充反白；解开的组＝白玻璃卡 + 左侧色条 + 组名用该组色。
    组色＝玫红/天蓝/琥珀/紫，**整页不含绿色**。
    ⚠ 姊妹页对照：bingo＝暖米黄（亮·暖）｜找内鬼＝暗青绿（暗·冷）｜首页＝白+墨绿；
      前几版（石墨+靛蓝／紫罗兰极光／淡紫晨光）依次被判"太像找内鬼"或被换掉，
      ⇒ 最终取"冷灰青底 + 一点蜜橙"；📦 淡紫晨光那套已存档给后续小游戏（见小游戏设计方案.md）。
-->
<style>
  /* ── 设计 token（**雾霾青灰底 × 蜜橙 accent** ｜2026-09-24 第 5 版 · ✅ 已定）────
     底色＝候选①「雾霾青灰」（冷调、安静、明度偏亮），accent＝候选②「奶油杏」的蜜橙。
     姊妹页对照：bingo＝暖米黄（亮·暖）｜找内鬼＝暗青绿（暗·冷）｜首页＝白+墨绿
       ⇒ 本页＝冷灰青底 + 一点蜜橙，色温与明度都错开，且**整页不含绿色**。
     📦 第 4 版「淡紫晨光 × 白玻璃」**存档留给后续小游戏**
       （--bg #eeeaf8／光晕 紫 rgba(139,92,246,.30)+蓝+玫红／accent 紫／--btnfill #241e40）
       —— 见 tools/小游戏设计方案.md「配色备选」一节。
     一种颜色只准一种含义（见页头注释）：
       未解开 ⇒ 一律中性 ｜ 解开后 ⇒ 该组色 ｜ 红色只留给「错了」
     ⚠ 组色是"浅底深版"，JS 用 `var(--g1)` 注入 ⇒ 换主题一处生效。                */
  :root{
    --bg:#e7ecef;                                 /* 雾霾青灰 */
    /* 玻璃：卡片/按钮＝半透明白 + 背景模糊，让背后的光晕透上来 */
    --surface:rgba(255,255,255,.74); --surface2:rgba(255,255,255,.58);
    --chip:rgba(255,255,255,.94);                 /* 选中态（分段控件／浮起的小片）*/
    --ink:#1e2a33; --sub:#5f707b;
    --line:rgba(30,42,51,.13); --line2:rgba(30,42,51,.08);
    --sh1:0 1px 2px rgba(30,42,51,.08);
    --sh2:0 20px 44px -22px rgba(30,42,51,.34);
    --red:#e11d48;
    --near-bg:rgba(217,119,6,.15); --near-ink:#b45309;
    --no-bg:rgba(225,29,72,.12);   --no-ink:#e11d48;
    --accent:#c2751b;                             /* 眉题＝奶油杏的蜜橙（只此一处用）*/
    /* 浅底 ⇒ 主按钮与选中格用墨黑填充（反白） */
    --btnfill:#22303a; --onbtn:#fff;
    /* 四组色：玫红・天蓝・琥珀・紫 —— 刻意避开绿色系 */
    --g1:#db2777; --g2:#0284c7; --g3:#b45309; --g4:#7c3aed;
    --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  }
  *{box-sizing:border-box}
  /* 兜住 hidden：作者样式里的 display（如 .lives{display:flex}）会**覆盖** UA 的
     [hidden]{display:none}，导致 el(x).hidden = true 静默失效 —— 踩过一次 */
  [hidden]{display:none !important}
  body{margin:0;color:var(--ink);min-height:100vh;font-size:15px;line-height:1.6;font-family:var(--sans);
       background:var(--bg);
       /* 雾：青灰（左上，主）＋淡紫（右下）—— 固定不随滚动，整页只此一处彩色 */
       background-image:
         radial-gradient(90% 60% at 8% -14%, rgba(112,150,170,.34), transparent 62%),
         radial-gradient(85% 60% at 78% 108%, rgba(120,120,175,.20), transparent 62%);
       background-attachment:fixed}
  .wrap{max-width:880px;margin:0 auto;padding:20px 18px 72px}
  .back{display:inline-block;font-size:12.5px;color:var(--sub);text-decoration:none;transition:color .15s}
  .back:hover{color:var(--ink)}
  /* ── 页头：无装饰线，靠字号/字重/留白建立层级 ─────────────────── */
  .masthead{padding:6px 0 2px}
  .masthead .eyebrow{font-size:11px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;
     color:var(--accent)}   /* 蜜橙：整页唯一一处"暖色点缀"（不参与组色语义）*/
  h1{margin:7px 0 0;font-size:34px;line-height:1.12;font-weight:700;letter-spacing:-.02em}
  .masthead .meta{margin-top:9px;font-size:13px;color:var(--sub)}

  /* ── 难度：胶囊分段控件（只有 简单／普通／难；难度只在"难"上挂一个小注）── */
  .bar{display:flex;align-items:center;justify-content:center;margin:18px 0 0}
  .seg{display:inline-flex;gap:4px;padding:4px;border-radius:13px;background:var(--line2)}
  .diff{font:inherit;font-size:13px;font-weight:600;cursor:pointer;border:0;border-radius:10px;
        background:transparent;color:var(--sub);padding:9px 20px;
        display:inline-flex;align-items:baseline;gap:5px;
        transition:background .18s,color .18s,box-shadow .18s}
  .diff .dnote{font-size:10px;font-weight:500;opacity:.65;letter-spacing:.02em}
  .diff:hover{color:var(--ink)}
  .diff.on{background:var(--chip);color:var(--ink);box-shadow:var(--sh1)}
  body.picking .bar{margin-top:30px}
  body.picking .seg{background:transparent;gap:8px;padding:0}
  body.picking .diff{padding:15px 30px;border:1px solid var(--line);background:var(--surface);box-shadow:var(--sh1)}
  body.picking .diff.on{border-color:var(--g1);box-shadow:0 0 0 3px rgba(79,70,229,.16),var(--sh1)}

  /* ── 容错点（Hard）──────────────────────────────────────────── */
  .lives{display:flex;gap:6px;justify-content:center;margin:0 0 12px}
  .lives i{width:9px;height:9px;border-radius:99px;background:var(--ink);opacity:.8;
           transition:background .2s,box-shadow .2s,opacity .2s}
  .lives i.low{background:var(--red);opacity:1}              /* 只剩 ≤2 次时剩下的点变红 */
  .lives i.gone{background:transparent;box-shadow:inset 0 0 0 1.5px var(--red);opacity:.5}
  .lives.hit{animation:sh .42s}                              /* 掉机会时整排抖一下 */

  /* ── 即时反馈：一枚悬浮胶囊（"差一匹"＝琥珀，"错误"＝红）────────── */
  .msg{display:flex;justify-content:center;align-items:center;min-height:40px;margin:12px 0 0;
       font-size:13px;color:var(--sub);text-align:center}
  .msg b{display:inline-block;font-size:13.5px;font-weight:600;padding:8px 16px;border-radius:999px;
       animation:pop .28s cubic-bezier(.2,.9,.3,1.2)}
  .msg.near b{background:var(--near-bg);color:var(--near-ink);box-shadow:inset 0 0 0 1px var(--near-bg)}
  .msg.no b{background:var(--no-bg);color:var(--no-ink);box-shadow:inset 0 0 0 1px var(--no-bg)}
  .msg.no{color:var(--no-ink)}

  /* ── 面板：一张浮起的白卡 ───────────────────────────────────── */
  .panel{margin-top:12px;padding:16px;background:var(--surface);border:1px solid var(--line);
        border-radius:18px;box-shadow:var(--sh1);
        backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}   /* 玻璃：透出背后极光 */
  .phead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:14px}
  .phead b{font-size:13px;font-weight:700}
  .phead span{font-size:11.5px;color:var(--sub)}

  /* 进度：四段＝四组，解开一段才染上该组色（未解开中性，不泄露分组）*/
  .prog{display:flex;gap:6px;margin:0 0 14px}
  .prog i{flex:1;height:4px;border-radius:99px;background:var(--line);transition:background .3s}
  .prog i.on{background:var(--c)}

  /* ── 已解开的组：**组色底**卡 + 左侧色条 + 组名用该组色 ─────────────
     ⚠️ 2026-09-25 用户：「每次选中正确答案以后出现的淡色，和原来没选的分不太出来」
        原样是 rgba(255,255,255,.58) —— 和棋盘上的白卡几乎一个色，只有 3px 侧条在带色。
        ⇒ 底色/描边改成**组色 22% / 32% 混白**（第一行 --surface2 是 color-mix 的兜底：
        不认 color-mix 的浏览器退回老样式，只是不够醒目，不会白屏）。 */
  .grp{display:block;padding:12px 14px;margin:8px 0;background:var(--surface2);
      background:color-mix(in srgb, var(--c) 22%, var(--chip));
      border:1px solid var(--line2);                    /* color-mix 兜底（同 --surface2 一行）*/
      border:1px solid color-mix(in srgb, var(--c) 32%, transparent);
      border-left:4px solid var(--c);border-radius:12px;
      color:var(--ink);text-align:left;box-shadow:var(--sh1);
      animation:in .32s cubic-bezier(.2,.9,.3,1)}
  @keyframes in{0%{transform:translateY(-6px);opacity:0}100%{transform:none;opacity:1}}
  .grp .gt{font-size:13.5px;font-weight:700;color:var(--c)}
  /* 称号卡：gt = 称号（主标题），gs = 规则文本（副标题）
     —— 裁定见 tools/赛马连线/条件与称号规则.md §0.1：规则文本是称号的注解，不是谜面 */
  .grp.titled .gt{font-size:15px}
  .grp .gs{font-size:11.5px;line-height:1.5;color:var(--sub);margin-top:2px}
  .grp .gm{font-size:13.5px;font-weight:600;line-height:1.6;margin-top:6px}
  .grp.lost{opacity:.62;filter:grayscale(.65)}                /* 没解开、被亮出来的组 */

  /* ── 棋盘：16 张浮起的白卡，选中＝墨黑填充（现代·高对比）────────── */
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  @media(max-width:620px){.grid{grid-template-columns:repeat(2,1fr)}}
  .tile{position:relative;min-height:78px;padding:12px 8px;border:1px solid var(--line);border-radius:14px;
        background:var(--surface);color:var(--ink);font:inherit;text-align:center;cursor:pointer;
        display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
        box-shadow:var(--sh1);
        transition:transform .16s cubic-bezier(.2,.9,.3,1),box-shadow .16s,background .16s,color .16s,border-color .16s}
  /* 字号由 JS 的 fitTiles() 按可用宽度写 inline font-size ⇒ 长马名自动缩小、不硬拆
     （word-break 只留作"缩到 10px 仍放不下"的兜底） */
  .tile .jp{font-size:15px;font-weight:600;line-height:1.25;word-break:break-all}
  .tile .en{font-size:9.5px;font-weight:500;color:var(--sub);letter-spacing:.08em;text-transform:uppercase;
        line-height:1.2;word-break:break-word}
  .tile:hover:not(.sel){transform:translateY(-3px);box-shadow:var(--sh2)}
  .tile.sel{background:var(--btnfill);border-color:var(--btnfill);color:var(--onbtn);
        box-shadow:0 12px 26px -14px rgba(30,42,51,.55)}
  .tile.sel .en{color:var(--onbtn);opacity:.65}
  .tile .ord{position:absolute;top:6px;right:6px;width:18px;height:18px;border-radius:6px;
        background:rgba(30,42,51,.08);color:var(--sub);font-size:10px;font-weight:700;
        display:flex;align-items:center;justify-content:center;animation:pop .22s ease-out}
  .tile.sel .ord{background:transparent;color:inherit;box-shadow:inset 0 0 0 1px currentColor;opacity:.6}
  @keyframes pop{0%{transform:scale(.5);opacity:0}100%{transform:none;opacity:1}}
  .tile.dim{opacity:.45}                       /* 已选满 4 个时，压暗未选中的 */
  .tile.bad{animation:sh .36s;border-color:var(--red);box-shadow:0 0 0 3px var(--no-bg)}
  /* 入场：只在开局时播一次（render() 每次点击都会重建格子，所以靠 #grid.enter 控制） */
  #grid.enter .tile{animation:tin .36s cubic-bezier(.2,.9,.3,1) both;
        animation-delay:calc(var(--i,0) * 18ms)}
  @keyframes tin{0%{transform:translateY(10px);opacity:0}100%{transform:none;opacity:1}}
  @keyframes sh{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}
                40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}

  /* ── 按钮：圆角描边；主操作＝墨黑填充，hover 上浮 ─────────────── */
  .actions{margin-top:16px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap;align-items:center}
  button.b{font:inherit;font-size:13px;font-weight:600;padding:11px 22px;border-radius:12px;cursor:pointer;
        border:1px solid var(--line);background:var(--surface);color:var(--ink);box-shadow:var(--sh1);
        transition:transform .14s,box-shadow .14s,background .14s,color .14s,border-color .14s}
  button.b:hover:not(:disabled){transform:translateY(-1px);box-shadow:var(--sh2)}
  button.b:active:not(:disabled){transform:translateY(0)}
  button.b:disabled{opacity:.4;cursor:default;box-shadow:none}
  button.b.pri{background:var(--btnfill);color:var(--onbtn);border-color:var(--btnfill)}
  button.b.pri:hover:not(:disabled){box-shadow:0 16px 30px -16px rgba(30,42,51,.55)}
  /* 投降：压低存在感（确认走弹窗） */
  button.b.give{border-color:transparent;background:transparent;box-shadow:none;color:var(--sub);font-weight:500}
  button.b.give:hover:not(:disabled){color:var(--red);transform:none;box-shadow:none}

  /* ── 投降确认弹窗 ──────────────────────────────────────────── */
  .modal{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;
         padding:20px;background:rgba(30,42,51,.38);backdrop-filter:blur(6px);
         animation:fade .16s ease-out}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .sheet{width:100%;max-width:330px;padding:22px;text-align:center;border-radius:18px;
         background:var(--chip);border:1px solid var(--line);
         box-shadow:0 30px 64px -26px rgba(30,42,51,.40);
         backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
         animation:sheet .22s cubic-bezier(.2,.9,.3,1.1)}
  @keyframes sheet{from{transform:translateY(14px);opacity:0}to{transform:none;opacity:1}}
  .sheet .mt{font-size:15px;font-weight:700;margin:0 0 16px}
  .sheet .mrow{display:flex;gap:10px}
  .sheet .mrow .b{flex:1;padding:11px 0}

  #confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:9}
  #confetti i{position:absolute;top:-14px;width:7px;height:12px;border-radius:2px;opacity:.95;
        animation:fall linear forwards}
  @keyframes fall{to{transform:translateY(105vh) rotate(720deg);opacity:.9}}
</style>
</head>
<body>
<div id="confetti"></div>
<div class="wrap">
  <a class="back" href="../">← 返回首页</a>

  <!-- 页头：无装饰线，靠字号/字重/留白建立层级 -->
  <header class="masthead">
    <div class="eyebrow">Connections</div>
    <h1>赛马连线</h1>
    <div class="meta">16 匹马，4 个隐藏主题，每组恰好 4 匹</div>
  </header>

  <div class="bar">
    <div class="seg">
      <button class="diff" data-d="easy">简单</button>
      <button class="diff" data-d="normal">普通</button>
      <button class="diff" data-d="hard">难<span class="dnote">5 次机会</span></button>
    </div>
  </div>
  <div class="msg" id="msg"></div>

  <div id="board" hidden>
    <div class="panel">
      <div class="phead"><b>出走表</b><span>点选 4 匹 → 提交</span></div>
      <div class="prog" id="prog"></div>
      <div id="solved"></div>
      <div class="lives" id="lives" hidden></div>
      <div class="grid" id="grid"></div>
      <div class="actions">
        <button class="b" id="bClear">清除选择</button>
        <button class="b pri" id="bGo" disabled>提交</button>
        <button class="b give" id="bGive">投降</button>
        <button class="b" id="bNew" hidden>换一盘</button>
      </div>
    </div>
  </div>
  <div class="msg" id="load">载入题库…</div>
</div>

<!-- 投降确认 -->
<div class="modal" id="modal" hidden>
  <div class="sheet">
    <p class="mt">确定投降？</p>
    <div class="mrow">
      <button class="b" id="mNo">取消</button>
      <button class="b pri" id="mYes">确定</button>
    </div>
  </div>
</div>

<script>
/* EASY_TYPES：Easy 档只用认得度高的几类主题；Normal / Hard 全放开
   EASY_CONF ：Easy 档的混淆度上限（池内同时满足 ≥2 个主题的马占比）
   MAX_LIVES ：Hard 档全局容错；Easy / Normal 不限（不显示容错点）
   2026-09-23 用户裁定：**本作去掉对名气的限制** ⇒ 每组直接从**全部独占成员**里随机挑 4 匹
   （原来只从"名气前 10"里抽，现在会出现冷门马）。Bingo / 找内鬼 保持原样。 */
const EASY_TYPES = new Set(['sire','dsire','owner','breeder','coat','gen','center','ctry','g1race']);
/* EASY_MAX_CMP：Easy 档最多几组可以是复合条件。
   不加这条的话 Easy 和 Normal 一样难 —— 题库里复合 4678 张 vs 单条件 387 张，
   纯随机抽必然 ≈3.7/4 组都是复合，而 Easy 是给休闲玩家的档位。
   Normal 与 Hard 用**完全相同**的题池（只差容错次数），与参照站一致。 */
const EASY_CONF = 0.10, EASY_MAX_CMP = 2, MAX_LIVES = { hard: 5 };
/* 2026-09-24 内容池化（见 tools/赛马连线/单条件类型梳理.md §13）：
   池 = **白名单池**（生成器产出，约 190 张）⇒ 类型少、每类卡够多，所以改成
   ① **类型均匀**：先等概率抽 4 个类型，再在类内等概率抽 1 张（旧实现是"抽卡再拒绝同类型"＝按卡数加权）
   ② **称号 = 1 个类型**：title（真称号）与 concept（条件句）算同一类，共 23 张
   ③ **删掉旧的 TITLE_P 硬塞**：称号作为普通类型参与均匀抽，每盘出现率 ≈1/11×4 ≈ 32%，与旧值一致 */
const typeGrp = t => (t === 'title' || t === 'concept') ? 'title' : t;
/* 四组的身份色：**引用 CSS 变量**（--g1…--g4）而不是写死 hex ——
   这样深色模式下组色会自动跟着 :root 的深色值走。红色仍只留给"错了" */
const GCOLOR = ['var(--g1)', 'var(--g2)', 'var(--g3)', 'var(--g4)'];

let CARDS = [], NM = { n: [], e: [] };
/* order：棋盘上格子的**固定顺序**。只在开局打乱一次，解开一组就把那 4 匹摘掉，
   之后顺序不再变 —— 否则每次点击触发 render() 都会重排，玩家点一下棋盘就跳一次。 */
let diff = 'easy', groups = [], solved = [], sel = [], order = [], lives = 0, done = false;
let lastTry = '';   // 上一次判错的组合（排序后的键），用来禁用重复提交

const el = id => document.getElementById(id);
const ri = n => Math.random() * n | 0;
const pick = a => a[ri(a.length)];
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--){ const j = ri(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; };

/* ---------- 组题 ---------- */
function confusability(q){
  const u = new Set();
  q.forEach(c => c.set.forEach(h => u.add(h)));
  let multi = 0;
  for (const h of u) if (q.filter(c => c.set.has(h)).length >= 2) multi++;
  return multi / u.size;
}

function build(){
  const easy = diff === 'easy';
  const src = easy ? CARDS.filter(c => EASY_TYPES.has(c.conds[0].t)) : CARDS;
  // 按类型分桶 ⇒ 类型之间**等概率**（旧实现 pick(CARDS) 后拒绝同类型 = 按卡数加权，厩舎 vs 毛色差 21 倍）
  const byType = new Map();
  for (const c of src){
    const g = typeGrp(c.conds[0].t);
    if (!byType.has(g)) byType.set(g, []);
    byType.get(g).push(c);
  }
  const grps = [...byType.keys()];
  if (grps.length < 4) return null;
  for (let t = 0; t < 4000; t++){
    const q = shuffle(grps).slice(0, 4).map(g => pick(byType.get(g)));   // 4 个不同类型 × 类内随机
    if (easy && q.filter(c => c.conds.length === 2).length > EASY_MAX_CMP) continue;
    q.forEach(c => c.set || (c.set = new Set(c.h)));
    // 生命线：每张卡只从「独占成员」里挑 —— 每匹马恰好属于 1 组 ⇒ 分组唯一
    const excl = q.map((c, i) => {
      const others = new Set();
      q.forEach((o, j) => { if (j !== i) o.set.forEach(h => others.add(h)); });
      return c.h.filter(h => !others.has(h));
    });
    if (!excl.every(e => e.length >= 4)) continue;
    if (diff === 'easy' && confusability(q) > EASY_CONF) continue;
    const g = q.map((c, i) => ({
      card: c,
      hs: shuffle(excl[i]).slice(0, 4)
    }));
    if (new Set(g.flatMap(x => x.hs)).size !== 16) continue;
    return shuffle(g.map((x, i) => ({ ...x, color: GCOLOR[i] })));
  }
  return null;
}

/* ---------- 渲染 ---------- */
function render(){
  // 进度条：只有解开的那一段才染上组色，未解开的保持中性
  el('prog').innerHTML = groups.map(g => '<i class="' + (solved.includes(g) ? 'on' : '') +
    '" style="--c:' + g.color + '"></i>').join('');
  el('solved').innerHTML = solved.map(g =>
    '<div class="grp' + (g.late ? ' lost' : '') + (g.card.sub ? ' titled' : '') +
        '" style="--c:' + g.color + '">' +
      '<div class="gt">' + g.card.n + '</div>' +
      (g.card.sub ? '<div class="gs">' + g.card.sub + '</div>' : '') +
      '<div class="gm">' + g.hs.map(h => NM.n[h]).join(' ／ ') + '</div>' +
    '</div>').join('');
  if (done){
    el('grid').innerHTML = '';
    return;
  }
  const full = sel.length === 4;
  el('grid').innerHTML = order.map((h, i) => {
    const k = sel.indexOf(h);
    return '<button class="tile' + (k >= 0 ? ' sel' : (full ? ' dim' : '')) +
      '" data-h="' + h + '" style="--i:' + i + '">' +
      '<span class="jp">' + NM.n[h] + '</span>' +
      (NM.e[h] ? '<span class="en">' + NM.e[h] + '</span>' : '') +
      (k >= 0 ? '<span class="ord">' + (k + 1) + '</span>' : '') +
    '</button>';
  }).join('');
  fitTiles();
  // 选择没变就别让再提交一次 —— 刚判过错的组合，手快连点会白掉一条命
  el('bGo').disabled = sel.length !== 4 || sel.slice().sort().join() === lastTry;
  renderLives();
}

/* 马名字号自适应（2026-09-24 用户要求）
   长马名（如 ジェンティルドンナ・キタサンブラック）在窄屏两列下会被 word-break 硬拆 ⇒
   按**该格实际可用宽度**从 16px 逐 0.5px 往下收缩，直到一行放得下；缩到 10px 仍放不下才允许换行。
   为什么用测量而不是"按字数给档位"：格子宽度随视口/面板内边距变化，测量才是真自适应。 */
function fitTiles(){
  document.querySelectorAll('#grid .tile .jp').forEach(el => {
    const box = el.parentElement.clientWidth - 16;   // 扣掉 .tile 的左右内边距（8px × 2）
    el.style.whiteSpace = 'nowrap';
    let fs = 16;
    el.style.fontSize = fs + 'px';
    while (fs > 10 && el.scrollWidth > box){
      fs -= 0.5;
      el.style.fontSize = fs + 'px';
    }
    if (el.scrollWidth > box) el.style.whiteSpace = '';   // 兜底：确实太长 ⇒ 交回给 word-break
  });
}
/* 视口变化（旋屏 / 拖窗口）后宽度变了 ⇒ 重算一次（防抖） */
let fitT = 0;
addEventListener('resize', () => { clearTimeout(fitT); fitT = setTimeout(fitTiles, 120); });

/* 单独抽出来：猜错时只需刷新容错点，不必整盘重绘（重绘会打断抖动，也没必要） */
function renderLives(){
  el('lives').hidden = !MAX_LIVES[diff];
  if (!MAX_LIVES[diff]) return;
  const left = MAX_LIVES[diff] - lives;
  el('lives').innerHTML = Array.from({ length: MAX_LIVES[diff] },
    (_, i) => '<i class="' + (i < lives ? 'gone' : (left <= 2 ? 'low' : '')) + '"></i>').join('');
}

/* ---------- 交互 ---------- */
el('grid').addEventListener('click', e => {
  const t = e.target.closest('.tile'); if (!t || done) return;
  const h = +t.dataset.h;
  if (sel.includes(h)) sel = sel.filter(x => x !== h);
  else if (sel.length < 4) sel.push(h);
  el('msg').className = 'msg'; el('msg').innerHTML = '';   // 玩家重新动手了，上一条反馈收掉
  render();
});

el('bClear').onclick = () => { sel = []; render(); };

el('bGo').onclick = () => {
  if (sel.length !== 4 || done) return;
  const hit = groups.find(g => !solved.includes(g) && sel.every(h => g.hs.includes(h)));
  el('msg').className = 'msg';
  if (hit){
    hit.hs = sel.slice();                    // 按玩家提交的顺序展示（成员等价于原组）
    solved.push(hit); sel = [];
    order = order.filter(h => !hit.hs.includes(h));   // 摘掉这 4 匹，其余格子**保持原位**
    el('msg').innerHTML = '';
    render();
    if (solved.length === 4) finish(true);
    return;
  }
  // 错了：记一次；「差一匹」是 Connections 的招牌反馈（说明这次提交差在哪）
  if (MAX_LIVES[diff]){                        // 掉机会时整排抖一下
    lives++;
    el('lives').classList.add('hit');
    setTimeout(() => el('lives').classList.remove('hit'), 460);
  }
  const near = groups.some(g => !solved.includes(g) && sel.filter(h => g.hs.includes(h)).length === 3);
  el('msg').className = near ? 'msg near' : 'msg no';
  el('msg').innerHTML = near ? '<b>差一匹就对了！</b>' : '<b>错误</b>';
  document.querySelectorAll('.tile.sel').forEach(t => {
    t.classList.add('bad'); setTimeout(() => t.classList.remove('bad'), 380);
  });
  if (MAX_LIVES[diff] && lives >= MAX_LIVES[diff]) return finish(false);
  // **不清空选择**：玩家多半只想换掉其中一匹，让他重新选四个是折磨
  lastTry = sel.slice().sort().join();
  renderLives();
  el('bGo').disabled = true;
};

function finish(win){
  done = true;
  // 输了也把答案亮出来（标 late ⇒ 渲染时压暗，和玩家自己解开的组区分开）
  if (!win) groups.filter(g => !solved.includes(g)).forEach(g => { g.late = true; solved.push(g); });
  el('msg').className = 'msg';
  el('msg').innerHTML = '';
  sel = []; render();
  el('bClear').hidden = true; el('bGo').hidden = true; el('bGive').hidden = true;
  el('bNew').hidden = false; closeModal();
  if (win) confetti(70);
}

function confetti(n){
  const box = el('confetti'), cols = ['#db2777', '#0284c7', '#b45309', '#7c3aed', '#e11d48', '#241e40'];
  let html = '';
  for (let i = 0; i < n; i++)
    html += '<i style="left:' + (Math.random() * 100).toFixed(1) + '%;background:' + pick(cols) +
      ';animation-duration:' + (1.6 + Math.random() * 1.6).toFixed(2) + 's;animation-delay:' +
      (Math.random() * .7).toFixed(2) + 's"></i>';
  box.innerHTML = html;
  setTimeout(() => { box.innerHTML = ''; }, 4200);
}

/* started：进场时是「选难度」状态（started=false，没有开局，也不预先选中任何一档），
   玩家点了某一档才开局。之后三档按钮常驻，用于中途换难度。 */
let started = false;
function syncDiff(){
  document.querySelectorAll('.diff').forEach(b =>
    b.classList.toggle('on', started && b.dataset.d === diff));
}

function start(){
  const g = build();
  if (!g){ el('load').textContent = '组题失败，刷新重试'; return; }
  started = true;
  document.body.classList.remove('picking');
  groups = g; solved = []; sel = []; lives = 0; done = false; lastTry = '';
  order = shuffle(g.flatMap(x => x.hs));      // 开局打乱一次，之后不再重排
  el('load').hidden = true; el('board').hidden = false;
  el('bClear').hidden = false; el('bGo').hidden = false; el('bNew').hidden = true;
  el('bGive').hidden = false; closeModal();
  syncDiff();
  render();
  // 入场动画只在开局播一次：render() 每次点击都会重建格子，动画挂在 #grid.enter 上才不会反复重播
  el('grid').classList.add('enter');
  setTimeout(() => el('grid').classList.remove('enter'), 900);
}

document.querySelectorAll('.diff').forEach(b => b.onclick = () => { diff = b.dataset.d; start(); });
el('bNew').onclick = () => start();

/* 投降：弹窗二次确认。直接认输太容易被误触，而这一局就白玩了。 */
function closeModal(){ el('modal').hidden = true; }
el('bGive').onclick = () => { if (!done) el('modal').hidden = false; };
el('mNo').onclick = closeModal;
el('mYes').onclick = () => { closeModal(); finish(false); };   // 投降 = 按失败收场：答案亮出来
el('modal').onclick = e => { if (e.target === el('modal')) closeModal(); };   // 点遮罩也关
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

/* 出错时必须说清是哪一步：fetch 失败 / HTTP 状态 / 组题或渲染抛异常，
   否则一律显示「载入失败」，真因被吞掉，没法排查。 */
const get = u => fetch(u).then(r => {
  if (!r.ok) throw new Error(u + ' → HTTP ' + r.status);
  return r.json();
});
Promise.all([
  get('../assets/data/connections/cards.json'),
  get('../assets/data/connections/names.json')
]).then(([d, nm]) => {
  CARDS = d.cards || []; NM = nm;
  if (!CARDS.length) throw new Error('cards.json 里没有卡片');
  // **不自动开局**：进场停在「选难度」状态，由玩家点某一档才开始
  el('load').hidden = true;
  document.body.classList.add('picking');
  syncDiff();
}).catch(e => {
  console.error('[赛马连线] 启动失败：', e);
  el('load').className = 'msg no';
  el('load').textContent = '启动失败：' + (e && e.message ? e.message : e) +
    '　（若是用 file:// 直接打开的，浏览器禁止读本地数据，请用 HTTP 访问）';
});
</script>
</body>
</html>
